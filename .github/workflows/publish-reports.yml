name: Publish competition reports

on:
  push:
    branches: [main]
    paths:
      - "bank/docs/**"
      - "playground-series-s5e4/docs/**"
      - "playground-series-s5e6/docs/**"
      - "bank/src/build_portfolio.py"
      - ".github/workflows/publish-reports.yml"

permissions:
  contents: write

concurrency:
  group: publish-competition-reports
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble GitHub Pages tree
        run: python bank/src/build_portfolio.py
      - name: Commit updated Pages files
        run: |
          if git diff --quiet -- docs; then
            echo "Pages files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Publish updated competition reports"
          git push
